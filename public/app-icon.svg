<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="45%" stop-color="#180b2b" />
      <stop offset="100%" stop-color="#020d1c" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="64%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="faceAura" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ff3388" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyberGlow)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Ambient Light Halos -->
  <circle cx="330" cy="165" r="160" fill="url(#eyeGlow)" />
  <circle cx="160" cy="120" r="180" fill="url(#faceAura)" />

  <!-- Cybernetic Silhouette Face Contour -->
  <path d="M 80,40 C 180,40 250,90 280,140 C 295,165 315,195 310,230 C 300,290 240,340 270,390 C 290,425 340,435 380,470 L 80,470 Z" fill="#2d124d" opacity="0.35" />
  <path d="M 120,40 C 200,60 270,120 285,175 C 295,210 275,260 260,295 C 245,330 255,360 285,385 C 310,405 345,415 375,445" fill="none" stroke="#e879f9" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round" />

  <!-- Digital Data Matrix Pixels (Left & Cheeks) -->
  <g fill="#ec4899" opacity="0.65">
    <rect x="70" y="240" width="12" height="12" rx="2" />
    <rect x="90" y="240" width="12" height="12" rx="2" />
    <rect x="110" y="240" width="12" height="12" rx="2" />
    <rect x="90" y="260" width="12" height="12" rx="2" />
    <rect x="110" y="260" width="12" height="12" rx="2" fill="#00f5ff" />
    <rect x="130" y="260" width="12" height="12" rx="2" />
    <rect x="150" y="260" width="12" height="12" rx="2" />
    <rect x="110" y="280" width="12" height="12" rx="2" />
    <rect x="130" y="280" width="12" height="12" rx="2" fill="#00f5ff" />
    <rect x="150" y="280" width="12" height="12" rx="2" />
    <rect x="170" y="280" width="12" height="12" rx="2" />
    <rect x="190" y="280" width="12" height="12" rx="2" />
    <rect x="130" y="300" width="12" height="12" rx="2" />
    <rect x="150" y="300" width="12" height="12" rx="2" fill="#00f5ff" />
    <rect x="170" y="300" width="12" height="12" rx="2" />
    <rect x="190" y="300" width="12" height="12" rx="2" />
    <rect x="210" y="300" width="12" height="12" rx="2" fill="#f43f5e" />
  </g>

  <!-- Circuit Connection Lines -->
  <path d="M 70,360 L 140,360 L 180,320 L 240,320" fill="none" stroke="#00f5ff" stroke-width="2.5" stroke-opacity="0.7" />
  <circle cx="70" cy="360" r="5" fill="#00f5ff" />
  <path d="M 100,410 L 200,410 L 235,375 L 300,375" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-opacity="0.6" />
  <circle cx="300" cy="375" r="4" fill="#ff007a" />
  
  <circle cx="110" cy="320" r="22" fill="none" stroke="#ec4899" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="6,4" />
  <circle cx="110" cy="320" r="10" fill="none" stroke="#00f5ff" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Holographic Eye Cyber HUD Reticle -->
  <g transform="translate(330, 165)" filter="url(#glow)">
    <!-- Outer Arc Track -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#cyberGlow)" stroke-width="4.5" stroke-dasharray="120 40 80 30" stroke-linecap="round" />
    
    <!-- Segmented Tech Ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#00f5ff" stroke-width="3" stroke-dasharray="14 8" stroke-opacity="0.9" />

    <!-- Corner Brackets -->
    <path d="M -70,-50 L -85,-50 L -85,-35" fill="none" stroke="#ff007a" stroke-width="4" stroke-linecap="round" />
    <path d="M 70,-50 L 85,-50 L 85,-35" fill="none" stroke="#ff007a" stroke-width="4" stroke-linecap="round" />
    <path d="M -70,50 L -85,50 L -85,35" fill="none" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" />
    <path d="M 70,50 L 85,50 L 85,35" fill="none" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" />

    <!-- Inner Rotating Gauge Dial -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#e879f9" stroke-width="6" stroke-dasharray="8 6" stroke-opacity="0.85" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00f5ff" stroke-width="3.5" stroke-opacity="0.9" />

    <!-- Central Target Eye Iris -->
    <circle cx="0" cy="0" r="28" fill="#090d24" stroke="#00f5ff" stroke-width="3" />
    <circle cx="0" cy="0" r="14" fill="#00f5ff" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />

    <!-- Crosshair Pointers -->
    <line x1="-35" y1="0" x2="-22" y2="0" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
    <line x1="22" y1="0" x2="35" y2="0" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="-35" x2="0" y2="-22" stroke="#ff007a" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="22" x2="0" y2="35" stroke="#ff007a" stroke-width="3" stroke-linecap="round" />

    <!-- Top-Right Sub-Dial -->
    <g transform="translate(62, -58)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#00f5ff" stroke-width="2.5" stroke-dasharray="60 30" />
      <circle cx="0" cy="0" r="24" fill="none" stroke="#ff007a" stroke-width="2" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="6" fill="#00f5ff" />
    </g>
  </g>

  <!-- Top Cyber Status Bar / Brand Accent -->
  <g fill="#00f5ff" opacity="0.8">
    <rect x="50" y="55" width="28" height="6" rx="3" />
    <rect x="86" y="55" width="12" height="6" rx="3" fill="#ff007a" />
    <rect x="106" y="55" width="60" height="6" rx="3" fill="#9333ea" />
    <circle cx="450" cy="58" r="8" fill="#00f5ff" />
    <circle cx="425" cy="58" r="4" fill="#ff007a" />
  </g>
</svg>
